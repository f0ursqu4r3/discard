[workspace]
resolver = "3"
members = [
    "crates/discard-core",
    "crates/discard-providers",
    "crates/discard-lua",
    "crates/discard-mcp",
    "crates/discard-ui",
    "crates/discard-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
nix = { version = "0.30", features = ["signal"] }
regex = "1"
mlua = { version = "0.12", features = ["luau", "vendored", "serialize", "send"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
similar = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
toml = "0.9"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
discard-core = { path = "crates/discard-core" }
discard-providers = { path = "crates/discard-providers" }

# Key derivation is slow in debug builds. Optimize just the crypto crates so tests stay quick.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
