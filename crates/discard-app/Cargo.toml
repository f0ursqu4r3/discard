[package]
name = "discard-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
discard-core.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
discard-core.workspace = true
discard-lua = { path = "../discard-lua" }
discard-mcp = { path = "../discard-mcp" }
discard-providers.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
uuid.workspace = true
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
base64 = "0.23.1"

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3"
