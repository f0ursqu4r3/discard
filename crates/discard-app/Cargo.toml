[package]
name = "discard-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
discard-core.workspace = true
discard-lua = { path = "../discard-lua" }
discard-mcp = { path = "../discard-mcp" }
discard-providers.workspace = true
discard-ui = { path = "../discard-ui" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile = "3"
